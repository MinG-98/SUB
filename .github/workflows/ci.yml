name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: ruff
        run: ruff check .

      - name: black --check
        run: black --check .

      - name: Compile check
        run: python -m compileall -q app scripts agent/node-agent.py agent/tests tests

      - name: pytest
        run: pytest -q

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Frontend tests and production build
        working-directory: frontend
        run: npm ci && npm test && npm run build -- --outDir "$RUNNER_TEMP/sub-ui-build"

      - name: Assemble source and matching static assets
        run: |
          release_dir="$RUNNER_TEMP/sub-release"
          mkdir -p "$release_dir/static" "$release_dir/frontend"
          cp -R app agent scripts deploy README.md LICENSE pyproject.toml requirements.txt "$release_dir/"
          cp -R frontend/src frontend/public "$release_dir/frontend/"
          cp frontend/index.html frontend/package.json frontend/package-lock.json frontend/vite.config.js "$release_dir/frontend/"
          cp -R "$RUNNER_TEMP/sub-ui-build/." "$release_dir/static/"
          test -s "$release_dir/static/index.html"
          test -s "$release_dir/static/favicon.svg"
          test ! -e "$release_dir/frontend/node_modules"
          python scripts/verify_release.py --release-dir "$release_dir"

      - name: Upload non-deployed release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sub-release-${{ github.sha }}
          path: ${{ runner.temp }}/sub-release
          if-no-files-found: error
          retention-days: 7
